query GetProposalVotesRange($proposalId: String!, $created_gte: Int!, $created_lt: Int!) {
  votes(first: 1000, where: { proposal: $proposalId, created_gte: $created_gte, created_lt: $created_lt }, orderBy: "created", orderDirection: asc) {
    id
    voter
    created
    choice
    vp
    reason
    proposal {
      id
      title
    }
  }
}
