query ListProposals($organisationKeys: [String!]!, $first: Int!, $skip: Int!, $start_gte: Int!, $end_lte: Int!) {
  proposals(
    first: $first
    skip: $skip
    where: { space_in: $organisationKeys, start_gte: $start_gte, end_lte: $end_lte, state: "closed" }
    orderBy: "start"
    orderDirection: asc
  ) {
    id
    title
    start
    end
    created
    state
    snapshot
    type
    choices
    space {
      id
      name
    }
  }
}
