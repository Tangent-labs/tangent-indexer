query ListProposalsOverlappingWindow($orga: String!, $start_lte: Int!, $end_gte: Int!, $first: Int!, $skip: Int!) {
  proposals(
    first: $first
    skip: $skip
    where: { space: $orga, start_lte: $start_lte, end_gte: $end_gte, state: "closed" }
    orderBy: "start"
    orderDirection: asc
  ) {
    id
    title
    start
    end
    created
    state
    snapshot
    type
    choices
  }
}
